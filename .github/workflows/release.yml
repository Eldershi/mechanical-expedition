name: Verify NeoForge test version

on:
  push:
    branches: ["migration/1.21.1-neoforge"]
    tags: ["v1.21.1-test.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify test manifest and release ref
        run: python3 development/ports/1.21.1/release/package_test.py validate
