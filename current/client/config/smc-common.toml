
[LuckyClover]
	#If it's true, Lucky Clover will drop banned items (like Debug and Creative items)
	LuckyCloverCreative = false
	#If it's true, Lucky Clover will get random stack size of item (depends on the max stack size of this item)
	LuckyCloverStack = false
	#Define the cooldown of Lucky Clover (in MC tick)
	#Range: > 0
	LuckyCloverCD = 20
	#A list of items which can never be obtained from Lucky Clover.
	LuckyCloverBlacklistItems = ["minecraft:bedrock", "minecraft:command_block", "minecraft:repeating_command_block", "minecraft:chain_command_block", "minecraft:command_block_minecart", "minecraft:jigsaw", "minecraft:structure_block", "minecraft:structure_void", "minecraft:barrier", "minecraft:light", "minecraft:potion", "minecraft:knowledge_book", "minecraft:end_portal_frame", "create:handheld_worldshaper", "enigmaticlegacy:enigmatic_item", "enigmaticlegacy:the_judgement"]
	#A list of keywords. Items ID with those keywords can never be obtained from Lucky Clover.
	#If you want to ban all items from one mod, write "mod_id:", example: "avaritia:"
	LuckyCloverBlacklistKeywords = ["creative", "debug"]
	#(Not recommended!) A list of items which Lucky Clover can only contain. Empty means no whitelist.
	LuckyCloverWhitelistItems = []
	#A list of keywords. Lucky Clover can only contain Items which their ID with those keywords. Empty means no whitelist.
	#If you want to add all items from one mod or only from minecraft, write "mod_id:", example: "minecraft:", "farmersdelight:"
	LuckyCloverWhitelistKeywords = []
	#If it's true, Lucky Clover will lose the ability of dropping items.
	LuckyCloverDisable = false

[LuckyNugget]
	#Define the duration of effects which gives by Lucky Nugget (in tick)
	#Range: > 0
	LuckyNuggetDuration = 6000
	#Define the amplifier (level) of effects which gives by Lucky Nugget (0 means I, 1 means II and so on.)
	#Range: 0 ~ 100
	LuckyNuggetAmp = 0
	#If it's true, the duration of effects gives by Lucky Nugget will be infinite.
	LuckyNuggetInfinite = false

[BadApple]
	#Define the possibility of obtaining bad apple item after you ate an apple.
	#Range: 0 ~ 100
	BadAppleRate = 3
	#Define the possibility of obtaining bad apple item after you ate an apple when you have Bad Omen effect.
	#Range: 0 ~ 100
	BadAppleRateWithBadOmen = 35

[DevourSword]
	#Whether to enable the capability of shooting sword.
	ShootingSwords = true
	#Define the amount of damage increased by each sword.
	#Range: 0.0 ~ 1.7976931348623157E308
	DamageAdd = 0.5
	#Define the percentage of damage inherited from Devour Sword (Devoured sword number * damage inherit * damage add).
	#Range: 0.0 ~ 1.7976931348623157E308
	DamageInherit = 0.5
	#Define the sword amount requirement for increase the shooting sword amount.
	#Range: > 0
	UpgradeAmount = 9
	#Define the max shooting sword amount.
	#Range: > 1
	MaxShootingAmount = 6

[DevourKnife]
	#Define the amount of damage increased by each knife.
	#Range: 0.0 ~ 1.7976931348623157E308
	DamageAdd = 0.25

[DivineHalo]
	#Define the recover cooldown of Divine Halo (in seconds).
	#Range: > 0
	RecoverCooldown = 15
	#Define the cooldown of Divine Halo (in seconds) when this item is trying to revive the player.
	#Range: > 0
	ReviveCooldown = 300
	#Define the percentage of damage reduction by Divine Halo when the ability is totally recovered.
	#Range: 0.0 ~ 100.0
	MaxReduction = 100.0
	#Define the percentage of damage reduction by Divine Halo when the ability is totally consumed.
	#Range: 0.0 ~ 100.0
	MinReduction = 30.0
	#The ability of Divine Halo will decrease when you taken damage. Define the percentage of ability consumption.
