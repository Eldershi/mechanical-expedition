
#战斗系统相关配置
#Combat system configurations
[combat]
	#法术战斗任务里女仆的索敌与施法距离，超出这个距离她就不再出手 (默认: 24.0 格)
	#How far a maid will pick targets and cast during a spell-combat task, in blocks.
	#Range: 8.0 ~ 64.0
	maxSpellRange = 24.0
	#近战任务判定「够得着」的距离，比原版手长一点，女仆才追得上边走边打的目标 (默认: 2.5 格)
	#Melee reach used by the melee task, in blocks.
	#Range: 1.0 ~ 5.0
	meleeRange = 2.5
	#远程任务的开火距离，箭矢/法术从这个距离开始出手 (默认: 8.5 格)
	#Firing distance used by the far task, in blocks.
	#Range: 1.0 ~ 20.0
	farRange = 8.5
	#女仆在法术战斗任务下的伤害倍率；只有装着那个任务才吃这条，填 0 等于让她一点输出都没有 (默认: 1.0)
	#Damage multiplier for the maid while running the spell-combat task. 0 turns her damage off.
	#Range: 0.0 ~ 50.0
	maidDamageMultiplier = 1.0
	#法术战斗任务中的女仆法术冷却倍率；越小施法越频繁
	#Maid spell cooldown multiplier during spell combat; lower values allow more frequent casts.
	#Range: 0.0 ~ 50.0
	maidCooldownMultiplier = 1.0
	#近战任务两次出手之间至少隔这么多 tick；调小是贴脸连击，调大输出直接掉一档 (默认: 8 tick，即 0.4 秒)
	#Minimum ticks between two attacks in a melee task (default 8 ticks = 0.4 seconds).
	#Range: 1 ~ 100
	meleeAttackInterval = 8
	#远程任务两次出手之间的间隔，同样按 tick 算 (默认: 5 tick，即 0.25 秒)
	#Minimum ticks between two attacks in a far task (default 5 ticks = 0.25 seconds).
	#Range: 1 ~ 100
	farAttackInterval = 5
	#女仆不施放列表中的法术；可填完整 id 或 regex: 前缀的正则
	#Maids will not cast listed spells. Use full ids or regex: patterns.
	spellBlacklist = ["irons_spellbooks:spectral_hammer"]

